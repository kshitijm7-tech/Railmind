  /api/v1/plans/{plan_id}/simulate:
    post:
      tags:
      - engine
      summary: "Run the \xA717.6 Monte Carlo robustness pass for a plan (E05 engine)"
      description: "Seeded Monte Carlo over the request's block windows.\n\n``plan_id``\
        \ identifies the candidate for provenance/audit and is carried\nverbatim as\
        \ the result's ``candidateId``. Caller-supplied seed and\niteration count\
        \ are passed through to the engine exactly (no backend-side\nRNG, \xA713);\
        \ absent values use the authoritative E05 defaults (N=200/0)."
      operationId: simulate_plan_endpoint_api_v1_plans__plan_id__simulate_post
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          title: Plan Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_SimulateResponse_'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: Bad Request
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/scenarios:
    post:
      tags:
      - engine
      summary: Register a stateless scenario identity (E04/E05 pass-through)
      description: "E07 Tier-1 reality (\xA715/\xA716): E04 compares caller-supplied\
        \ candidate\nsolutions and E05 consumes caller-supplied windows \u2014 there\
        \ is no scenario\nstate to store. This endpoint validates the identity envelope\
        \ and returns\nit; the authoritative simulation/comparison state family remains\
        \ a later\nphase (documented in docs/E07_Report.md \xA711)."
      operationId: create_scenario_api_v1_scenarios_post
      requestBody:
        content:
          application/json:
            schema:
              type: object
              title: Request
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_dict_'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/scenarios/{scenario_id}/simulate:
    post:
      tags:
      - engine
      summary: "Run the \xA717.6 robustness pass under a scenario identity (E05 engine)"
      description: "Same deterministic E05 pass as the plan endpoint; ``scenario_id``\
        \ is\ncarried verbatim as the result's ``candidateId`` so risk evidence stays\n\
        traceable to the scenario the caller named (\xA714 candidate association)."
      operationId: simulate_scenario_endpoint_api_v1_scenarios__scenario_id__simulate_post
      parameters:
      - name: scenario_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          title: Scenario Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_SimulateResponse_'
        '400':
          content:
            application/json:
