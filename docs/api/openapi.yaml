      - engine
      summary: Evaluate maintenance priority for one task (E02 engine)
      description: 'Deterministic E02 priority with full factor explainability.


        Invalid criticality/overdue/numeric values fail with 400 and the

        engine''s authoritative validation message (no silent defaults).'
      operationId: prioritize_task_api_v1_maintenance_prioritize_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrioritizeTaskRequest'
